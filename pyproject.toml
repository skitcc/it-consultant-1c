[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "it-consultant"
version = "0.1.0"
description = "IT consultant services: Knowledge RAG API, filesystem indexer and Exchange gateway"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "exchangelib>=5.4.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
    "qdrant-client>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "watchdog>=4.0.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "docling>=2.0.0",
]
reindex = [
    "watchdog>=4.0.0",
]

[project.scripts]
mail-gateway = "mail_gateway.__main__:main"
api-gateway = "api_gateway.__main__:main"
knowledge-sync = "knowledge_sync.__main__:main"
reindex = "reindex.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["common", "knowledge", "api_gateway", "knowledge_sync", "mail_gateway", "reindex"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: full install with venv/pip (skipped when venv unavailable)",
]
