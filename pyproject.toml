[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mail-gateway"
version = "0.1.0"
description = "Email gateway for IT consultant: Exchange EWS to AI service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "exchangelib>=5.4.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
mail-gateway = "mail_gateway.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["mail_gateway"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
